@PART[*]:HAS[@MODULE[ModuleResourceIntake[#resourceName[IntakeAir]]]]
{
	+MODULE[ModuleResourceIntake]
	{
		@resourceName = IntakeAtmosphere
	}
	+RESOURCE[IntakeAir]
	{
		@name = IntakeAtmosphere
	}
	&MODULE[ModuleResourceIntakeController]
	{
		intakeEnabled = true
		controlGenerators = false
	}
}

