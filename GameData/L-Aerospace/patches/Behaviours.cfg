KERBALBEHAVIOUR
{
	HEAT-EXCHANGER:NEEDS[L-AEROSPACE_HEAT-PUMP]
	{
		name = AtmosFuel.MonoPropellant.Mk1

		MODULE
		{
			name = KerbalHeatExchanger
			active = true
			maxEnergyTransfer = 5000

			// The order of the RESOURCEs are crucial for the Module.
			// If a resource is missing, the consumed resources on the processing until the moment are lost!
			// Order the resources by the inverse order of scarcity/importance/price
			RESOURCE
			{
				name = ElectricCharge
				ratio = 0.00025		// How much of the resource will be consumed to exchange the maxEnergyTransfer.
			}
			RESOURCE
			{
				name = MonoPropellant
				ratio = 0.000075
			}
		}

		MODULE
		{
			name = KerbalHeatDissipator
			active = true
			maxEnergyTransfer = 5000

			// The order of the RESOURCEs are crucial for the Module.
			// The coolant is consumed in the order specified here. If the first ones gets unavailable or not enough, the next of the list is used.
			// Order the resources by the inverse order of scarcity/importance/price
			RESOURCE
			{
				name = IntakeAir
				// Resources without a ratio implies on ratio = 0, i.e. no consuption.
			}
			RESOURCE
			{
				name = LiquidFuel
				ratio = 0.0000075
			}
		}

		MODULE
		{
			name = KerbalHeatSink
			active = true
			maxEnergyTransfer = 5000
		}
	}

